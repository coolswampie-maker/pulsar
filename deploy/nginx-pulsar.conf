# ПУЛЬСАР — Nginx для pulsar.jaglionrus.ru
# Один домен: сам сайт (статический фронт из корня репозитория) + /api и /admin
# проксируются в Gunicorn. Django-статику (/static) и медиа (/media) Nginx отдаёт сам.
#
# 1) поправьте путь /srv/pulsar на свой (куда склонирован репозиторий);
# 2) положите файл в /etc/nginx/sites-available/pulsar и слинкуйте в sites-enabled;
# 3) сначала поднимите этот HTTP-конфиг, затем `certbot --nginx -d pulsar.jaglionrus.ru`
#    сам допишет 443-блок и редирект с 80 на 443.

server {
    listen 80;
    listen [::]:80;
    server_name pulsar.jaglionrus.ru;

    # безопасный лимит на размер загрузок (подтверждающие документы по KPI)
    client_max_body_size 25m;

    # --- REST API и кабинет оператора → Gunicorn ---
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- статика Django (админка, DRF) ---
    location /static/ { alias /srv/pulsar/backend/staticfiles/; access_log off; expires 30d; }

    # --- загруженные документы компаний ---
    # Отдаём только как вложение и запрещаем угадывание типа: файл, попавший сюда,
    # не должен исполниться в браузере на нашем же домене (кража сессии оператора).
    location /media/ {
        alias /srv/pulsar/backend/media/;
        access_log off;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "attachment";
        add_header Content-Security-Policy "default-src 'none'; sandbox";
        types { } default_type application/octet-stream;
    }

    # --- сам сайт (SPA): index.html + js/ css/ data/ assets/ из корня репозитория ---
    # ВАЖНО: web-корень совпадает с корнем репозитория, поэтому всё служебное
    # закрываем явно. Иначе по сети доступны backend/.env (SECRET_KEY, пароль БД)
    # и .git со всей историей.
    root /srv/pulsar;
    index index.html;

    # Проверка домена для Let's Encrypt — должна идти ПЕРЕД запретом точечных путей
    # (префикс ^~ выигрывает у регулярных выражений), иначе certbot не выпустит
    # и не продлит сертификат.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location ~ /\.            { deny all; }   # .git, .env, .gitignore и прочие точечные
    location ^~ /backend/     { deny all; }   # исходники Django, .env, база, media
    location ^~ /deploy/      { deny all; }   # эти самые конфиги
    location ~* \.(py|pyc|sqlite3|service|conf|example|md|log|ini|cfg|toml|yml|yaml)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

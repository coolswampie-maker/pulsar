# ПУЛЬСАР — заголовки безопасности для Nginx.
#
# Куда класть:
#     sudo cp /srv/pulsar/deploy/security-headers.conf \
#             /etc/nginx/snippets/pulsar-security.conf
#
# Как подключать — ВАЖНО, иначе часть заголовков молча пропадёт:
# в Nginx add_header НЕ складывается по уровням. Если в location есть хоть
# один свой add_header, все унаследованные от server отбрасываются. У нас в
# `location /` уже стоит Cache-Control, поэтому include нужен В ОБОИХ местах:
#
#     server {
#         listen 443 ssl;
#         ...
#         include /etc/nginx/snippets/pulsar-security.conf;   # ← и здесь
#
#         location / {
#             try_files $uri $uri/ /index.html;
#             add_header Cache-Control "no-cache";
#             include /etc/nginx/snippets/pulsar-security.conf;   # ← и здесь
#         }
#     }
#
# Подключать в блок 443 (в блоке 80 смысла нет: там только редирект, а HSTS
# по незащищённому соединению браузеры игнорируют).
#
# После правки:  sudo nginx -t && sudo systemctl reload nginx
# Проверить:     curl -sI https://pulsar.jaglionrus.ru | grep -i -E 'strict|frame|content-type-opt|referrer|policy'

# Не отдавать версию Nginx: она подсказывает, какие уязвимости пробовать.
server_tokens off;

# HSTS — запрет ходить на этот домен по http.
#
# Осознанно НЕ год, а сутки. Обратная сторона HSTS: если HTTPS сломается
# (просроченный сертификат, снесённый конфиг), браузеры откажутся открывать
# сайт вообще, вместо того чтобы откатиться на http. С max-age на год такое
# состояние держалось бы год у всех, кто успел зайти. Сутки дают ту же защиту
# от перехвата и оставляют право на ошибку.
#
# Когда HTTPS отработает пару месяцев без сбоев и автопродление подтвердится,
# значение можно поднять до 31536000 (год).
add_header Strict-Transport-Security "max-age=86400" always;

# Не угадывать тип файла по содержимому. Загруженный документ, который браузер
# сам решит считать HTML, — это готовый XSS на нашем же домене.
add_header X-Content-Type-Options "nosniff" always;

# Не встраивать сайт в чужой фрейм: защита от кликджекинга, в первую очередь
# для кабинета оператора.
add_header X-Frame-Options "SAMEORIGIN" always;

# Не утекать полный адрес страницы на сторонние сайты при переходе по ссылке.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Не давать браузеру запрашивать камеру, микрофон и геопозицию: сайту это не
# нужно, а запрет закрывает целый класс злоупотреблений при внедрении скрипта.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP. Все скрипты, стили, шрифты и картинки у нас свои — внешних CDN нет,
# поэтому default-src 'self' ничего не ломает.
#
# 'unsafe-inline' приходится оставить: в index.html есть инлайновый скрипт с
# настройками, а интерфейс собирается строками с инлайновыми стилями. Защита
# от этого слабеет, но главное CSP всё равно даёт — загрузить скрипт с чужого
# домена или отправить туда данные страница уже не может.
#
# Это единственный заголовок, который способен сломать вёрстку или подбор.
# После включения обязательно откройте сайт и посмотрите консоль (F12): если
# что-то заблокировано, там будет строка «Refused to load…».
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
